    ApprovalReason:
      type: object
      properties:
        code:
          enum:
            - MANUAL_DISCOUNT_ABOVE_THRESHOLD
            - MARGIN_BELOW_FLOOR
            - ZERO_REVENUE_WITH_COST
        level:
          enum:
            - SALES_MANAGER
            - FINANCE
        segment:
          type:
            - string
            - 'null'
          enum:
            - ONE_TIME
            - RECURRING
            - null
        observedBps:
          type:
            - integer
            - 'null'
        thresholdBps:
          type: integer
        message:
          type: string
    PricingBreakdown:
