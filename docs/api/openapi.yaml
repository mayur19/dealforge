components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: HTTP-only, SameSite=Lax session cookie set by POST /auth/login
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description:
        HMAC of the session token returned by login and GET /auth/session; required on unsafe
        methods together with a matching Origin header
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: &id006
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Role:
      type: string
      enum:
        - SALES_ADMIN
        - PRICING_MANAGER
        - SALES_REP
        - SALES_MANAGER
        - FINANCE_APPROVER
        - CUSTOMER_VIEWER
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - RATE_LIMITED
        - CSRF_FAILED
        - NOT_IMPLEMENTED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    ErrorBody:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          description: Field issues, ticket id, or domainCode for domain rule failures
        requestId:
          type: string
      required:
        - code
        - message
    ErrorEnvelope:
      type: object
      properties:
        success:
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
        - success
        - data
        - error
    PageMeta:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
      required:
        - total
        - page
        - limit
    HealthStatus:
      type: object
      properties:
        status:
          enum:
            - ok
            - ready
        version:
          type: string
      required:
        - status
        - version
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - email
        - password
    SessionUser:
      type: object
      properties:
        id: *id006
        organizationId: *id006
        organizationName:
          type: string
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
        - id
        - organizationId
        - organizationName
        - currencyCode
        - email
        - displayName
        - role
    SessionResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrfToken:
          type: string
          minLength: 32
      required:
        - user
        - csrfToken
    OrganizationMembership:
      type: object
      properties:
        organizationId: *id006
        organizationName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    ProductType:
      type: string
      enum:
        - ONE_TIME
        - RECURRING
    CreateProductRequest:
      type: object
      properties:
        sku:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$
          description: Trimmed and upper-cased by the server
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
          default: ''
        type:
          $ref: '#/components/schemas/ProductType'
        unit:
          type: string
          minLength: 1
          maxLength: 40
        listPriceMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        unitCostMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        active:
          type: boolean
          default: true
      required:
        - sku
        - name
        - category
        - type
        - unit
        - listPriceMinor
        - unitCostMinor
      additionalProperties: false
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        unit:
          type: string
        listPriceMinor:
          type: integer
          minimum: 0
        unitCostMinor:
          type: integer
          minimum: 0
        expectedUpdatedAt: &id007
          type: string
          format: date-time
      additionalProperties: false
    Product:
      type: object
      properties:
        id: *id006
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/ProductType'
        unit:
          type: string
        listPriceMinor:
          type: integer
          description: List price (integer minor units)
        unitCostMinor:
          type: integer
          description: Internal unit cost (integer minor units)
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        active:
          type: boolean
        createdAt: *id007
        updatedAt: *id007
      required:
        - id
        - sku
        - name
        - category
        - description
        - type
        - unit
        - listPriceMinor
        - unitCostMinor
        - currencyCode
        - active
        - createdAt
        - updatedAt
    ImportResult:
      type: object
      properties:
        dryRun:
          type: boolean
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              path:
                type: string
              message:
                type: string
    ProductOption:
      type: object
      properties:
        id: *id006
        label:
          type: string
        priceDeltaMinor:
          type: integer
          description: Price delta per unit (integer minor units)
        costDeltaMinor:
          type: integer
          description: Cost delta per unit (integer minor units)
        active:
          type: boolean
    OptionGroup:
      type: object
      properties:
        id: *id006
        name:
          type: string
        required:
          type: boolean
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/ProductOption'
    Bundle:
      type: object
      properties:
        id: *id006
        code:
          type: string
        name:
          type: string
        status:
          enum:
            - DRAFT
            - ACTIVE
            - ARCHIVED
        version:
          type: integer
        components:
          type: array
          items:
            type: object
            properties:
              productId: *id006
              quantity:
                type: integer
                minimum: 1
              required:
                type: boolean
              optionIds:
                type: array
                items: *id006
    PriceBook:
      type: object
      properties:
        id: *id006
        name:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          enum:
            - DRAFT
            - PUBLISHED
        version:
          type: integer
        activeFrom: &id008
          type: string
          format: date
        activeUntil:
          type:
            - string
            - 'null'
          format: date
        lines:
          type: array
          items:
            type: object
            properties:
              productId: *id006
              unitListMinor:
                type: integer
                description: List price (integer minor units)
              unitCostMinor:
                type: integer
                description: Cost (integer minor units)
    RuleConditions:
      type: object
      properties:
        productIds:
          type: array
          items:
            type: string
        productCategories:
          type: array
          items:
            type: string
        minQuantity:
          type: integer
          minimum: 1
        maxQuantity:
          type: integer
          minimum: 1
        customerTiers:
          type: array
          items:
            type: string
        bundleCodes:
          type: array
          items:
            type: string
      additionalProperties: false
      description: Restricted declarative conditions; every present condition must match
    RuleAction:
      oneOf:
        - type: object
          properties:
            type:
              const: PERCENT_DISCOUNT
            bps:
              type: integer
              minimum: 1
              maximum: 10000
          required:
            - type
            - bps
        - type: object
          properties:
            type:
              const: FIXED_DISCOUNT
            amountMinorPerUnit:
              type: integer
              minimum: 1
          required:
            - type
            - amountMinorPerUnit
    PricingRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        priceBookId: *id006
        category:
          enum:
            - VOLUME
            - CUSTOMER_TIER
            - BUNDLE
        priority:
          type: integer
          minimum: 0
          maximum: 10000
        effectiveFrom: *id008
        effectiveUntil:
          type:
            - string
            - 'null'
          format: date
        conditions:
