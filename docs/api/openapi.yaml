# DealForge API contract. x-status/x-ticket mark implemented vs pending operations.
openapi: 3.1.0
info:
  title: DealForge API
  version: 0.1.0
  description:
    CPQ and deal-desk API. Every response uses the envelope `{ success, data, error, meta?
    }`. Money is integer minor units and percentages are integer basis points (ADR-0013). Operations carry
    `x-status` (implemented or pending) and `x-ticket` (backlog id). Pending operations run authentication
    and permission guards, then answer 501 with their ticket. See docs/api/README.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:4104/api/v1
    description: Local API (development)
  - url: http://localhost:5174/api/v1
    description: Local web dev-server proxy (same origin as the browser app)
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and readiness
  - name: Auth
    description: Sessions and identity
  - name: Catalog
    description: Products, options and bundles (FR-01, FR-03, FR-04)
  - name: Pricing
    description: Price books, rules and simulation (FR-02, FR-05)
  - name: Customers
    description: Customer accounts and contacts
  - name: Quotes
    description: Quote families, immutable versions and lifecycle (FR-06, FR-07)
  - name: Approvals
    description: Approval inbox and decisions (FR-08)
  - name: Proposals
    description: Printable proposal and sharing (FR-09)
  - name: Customer portal
    description: Customer view and acknowledgment (FR-09)
  - name: Reporting
    description: Dashboard, reports, notifications, audit (FR-10)
  - name: Admin
    description: Users and organization settings
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
        - Health
      summary: Liveness probe (no dependencies)
      description: ''
      x-status: implemented
      x-ticket: DF-003
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                  error:
                    type: 'null'
    servers:
      - url: http://localhost:4104/api
        description: Health endpoints live outside /api/v1
  /health/ready:
    get:
      operationId: getReadiness
      tags:
        - Health
      summary: Readiness probe (checks PostgreSQL)
      description: ''
      x-status: implemented
      x-ticket: DF-003
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                  error:
                    type: 'null'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    servers:
      - url: http://localhost:4104/api
        description: Health endpoints live outside /api/v1
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Sign in with email and password
      description:
        Sets the HTTP-only `sid` session cookie and returns the CSRF token. Rate limited (AUTH_RATE_LIMIT_MAX
        per window). Failures return a generic 401.
      x-status: implemented
      x-ticket: DF-002
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/session:
    get:
      operationId: getSession
