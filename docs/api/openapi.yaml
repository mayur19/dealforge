        grossMinor:
          type: integer
        automaticDiscountMinor:
          type: integer
        manualDiscountMinor:
          type: integer
        netMinor:
          type: integer
        costMinor:
          type: integer
        grossProfitMinor:
          type: integer
        grossMarginBps:
          type:
            - integer
            - 'null'
