          type: string
        productId:
          type: string
        priceType:
          $ref: '#/components/schemas/ProductType'
        quantity:
          type: integer
        billingTermMonths:
          type:
            - integer
            - 'null'
        unitListMinor:
          type: integer
        unitCostMinor:
          type: integer
        effectiveUnitMinor:
          type: integer
        grossMinor:
          type: integer
        automaticDiscountMinor:
          type: integer
        manualDiscountMinor:
          type: integer
        manualDiscountBps:
          type: integer
        netMinor:
          type: integer
        costMinor:
          type: integer
        grossProfitMinor:
          type: integer
        grossMarginBps:
